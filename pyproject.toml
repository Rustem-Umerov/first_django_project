[project]
name = "first-django-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Rustem Umerov",email = "rustem.umerov.00@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django-stubs (>=6.0.2,<7.0.0)",
    "django-stubs-ext (>=6.0.2,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"
black = "^26.3.1"
flake8 = "^7.3.0"
isort = "^8.0.1"
mypy = "^1.20.0"
django-stubs = "^6.0.2"

