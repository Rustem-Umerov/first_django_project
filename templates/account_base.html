{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/back_button.css' %}">
{% endblock %}

{% block content %}
<div class="container-xl mt-5">

    <div class="row">

        <!-- Левое меню (каждое приложение вставляет своё) -->
        <div class="col-3">
            {% block account_sidebar %}{% endblock %}
        </div>

        <!-- Основной контент -->
        <div class="col-9">
            {% block account_content %}{% endblock %}
        </div>

    </div>

</div>
{% endblock %}
