<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

{% include "includes/messages.html" %}

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8" style="max-width: 800px;">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- Заголовок страницы -->
                    <h2 class="mb-4 text-center fw-bold">Личный кабинет</h2>

                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}

                        <!-- Блок вывода полей формы -->
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">{{ field.label }}</label>

                                <!-- Проверяем: если текущее поле — это аватар, выводим превью картинки -->
                                {% if field.name == 'avatar' %}
                                    <div class="mb-2">
                                        <!-- Показываем текущую аватарку пользователя -->
                                        <img src="{{ request.user.avatar_url }}"
                                             class="rounded-circle border shadow-sm"
                                             width="80"
                                             height="80"
                                             alt="Текущий аватар">
                                    </div>
                                {% endif %}

                                {{ field }}

                                <!-- Вывод ошибок конкретного поля, если они возникнут (например, неуникальный username) -->
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">
                                        {{ field.errors|striptags }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <!-- Блок кнопок управления снизу страницы -->
                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <!-- Ссылка "Назад" на главную страницу -->
                            <a href="/" class="btn btn-outline-secondary">
                                Назад на главную
                            </a>

                            <!-- Кнопка Сохранить изменения -->
                            <button type="submit" class="btn btn-primary btn-lg px-4">
                                Сохранить изменения
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
