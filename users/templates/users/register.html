<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: #f8f9fa;">

<div class="container mt-5" style="max-width: 600px;">

    <h2 class="mb-4 text-center">Регистрация нового профиля</h2>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">

            <form method="post">
                {% csrf_token %}

                <!-- Глобальные ошибки формы -->
                {% if form.non_field_errors %}
                <div class="alert alert-danger mb-3 shadow-sm">
                    {{ form.non_field_errors }}
                </div>
                {% endif %}

                <!-- Цикл по полям твоей UserRegisterForm -->
                {% for field in form %}
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">
                        {{ field.label }}
                    </label>

                    <!-- Рендерим само поле. -->
                    {{ field }}

                    <!-- Ошибки конкретного поля (например: "Пароли не совпадают") -->
                    {% if field.errors %}
                    <div class="text-danger small mt-1 fw-medium">
                        {{ field.errors|striptags }}
                    </div>
                    {% endif %}

                    <!-- Подсказка к полю (если есть) -->
                    {% if field.help_text %}
                    <div class="form-text text-muted small mt-1">
                        {{ field.help_text|safe }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}

                <!-- Блок кнопок внизу формы -->
                <div class="d-flex align-items-center justify-content-between mt-4 pt-3 border-top">
                    <!-- Ссылка "Назад на главную" -->
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                        Отмена
                    </a>

                    <!-- Кнопка отправки формы -->
                    <button type="submit" class="btn btn-success px-4 shadow-sm">
                        Создать аккаунт
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
